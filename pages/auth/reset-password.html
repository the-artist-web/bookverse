<body>

    <!-- Overlay & Progress Bar -->
    <div class="overlay" data-overlay></div>
    <div class="progress-bar" data-progress-bar></div>

    <!-- Start Loading -->
    <div class="start-loading" data-start-loading>
        <div class="logo extra-large">
            <img src="../../src/assets/images/logo.png" alt="noqta" class="img-logo img-cover" />
        </div>
    </div>
    
    <!-- Auth Page -->
    <article class="auth-page">

        <div class="auth-body">

            <a href="../../index.html" class="logo medium">
                <img src="../../src/assets/images/logo.png" alt="noqta" loading="lazy" class="img-logo img-cover">
            </a>

            <h1 class="text-headline-medium text-loard">Reset your password</h1>

            <form action="#" method="POST" class="auth-card">
                <div class="form-group">
                    <label for="password" class="text-body-medium">Password</label>

                    <div class="input-wrapper medium p-end-0" data-passwords>
                        <input type="password" placeholder="Enter your password" name="password" value="" id="password" class="text-body-large" />

                        <button type="button" class="icon-btn text medium" data-bs-toggle="toggle" data-bs-title="Show Password" data-bs-placement="bottom">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-eye"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" /></svg>

                            <div class="state-layer"></div>
                        </button>
                    </div>

                    <!-- <p class="text-error text-body-medium"></p> -->
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="text-body-medium">Confirm Password</label>

                    <div class="input-wrapper medium p-end-0" data-passwords>
                        <input type="password" placeholder="Enter your confirm password" name="" value="" id="confirm_password" class="text-body-large" />

                        <button type="button" class="icon-btn text medium" data-bs-toggle="toggle" data-bs-title="Show Password" data-bs-placement="bottom">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-eye"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" /></svg>

                            <div class="state-layer"></div>
                        </button>
                    </div>

                    <!-- <p class="text-error text-body-medium"></p> -->
                </div>

                <div class="wrapper-block">
                    <button type="submit" class="btn filled medium w-full">
                        <p class="text-body-large">Reset Password</p>
    
                        <div class="state-layer"></div>
                    </button>
    
                    <a href="../../pages/auth/login.html" class="btn outline medium w-full">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-left"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></svg>
                        
                        <p class="text-body-large">Sign In</p>

                        <div class="state-layer"></div>
                    </a>
                </div>
            </form>

        </div>

    </article>

</body>
