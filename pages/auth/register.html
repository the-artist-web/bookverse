<body>

    <!-- Overlay & Progress Bar -->
    <div class="overlay" data-overlay></div>
    <div class="progress-bar" data-progress-bar></div>

    <!-- Start Loading -->
    <div class="start-loading" data-start-loading>
        <div class="logo extra-large">
            <img src="../../src/assets/images/logo.png" alt="noqta" class="img-logo img-cover" />
        </div>
    </div>
    
    <!-- Auth Page -->
    <article class="auth-page">

        <div class="auth-body">

            <a href="../../index.html" class="logo medium">
                <img src="../../src/assets/images/logo.png" alt="noqta" loading="lazy" class="img-logo img-cover">
            </a>

            <div class="wrapper-block">
                <h1 class="text-headline-medium text-loard">Create Account</h1>

                <p class="text-body-large text-on-background-variant">Join our community of Noqta</p>
            </div>

            <form action="#" method="POST" class="auth-card">

                <div class="grid-2-base">
                    <a href="#" class="btn inverse medium w-full">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="icon icon-tabler icons-tabler-filled icon-tabler-brand-google"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 2a9.96 9.96 0 0 1 6.29 2.226a1 1 0 0 1 .04 1.52l-1.51 1.362a1 1 0 0 1 -1.265 .06a6 6 0 1 0 2.103 6.836l.001 -.004h-3.66a1 1 0 0 1 -.992 -.883l-.007 -.117v-2a1 1 0 0 1 1 -1h6.945a1 1 0 0 1 .994 .89c.04 .367 .061 .737 .061 1.11c0 5.523 -4.477 10 -10 10s-10 -4.477 -10 -10s4.477 -10 10 -10z" /></svg>
    
                        <p class="text-body-large">Google</p>
    
                        <div class="state-layer"></div>
                    </a>
    
                    <a href="#" class="btn inverse medium w-full">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-brand-facebook"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 10v4h3v7h4v-7h3l1 -4h-4v-2a1 1 0 0 1 1 -1h3v-4h-3a5 5 0 0 0 -5 5v2h-3" /></svg>
    
                        <p class="text-body-large">Facebook</p>
    
                        <div class="state-layer"></div>
                    </a>
                </div>
                
                <div class="wrapper flex-nowrap">
                    <div class="separator x"></div>

                    <p class="text-capitalize text-body-medium text-on-background-variant">Or</p>

                    <div class="separator x"></div>
                </div>

                <ul class="nav nav-tabs" id="tabAuth">
                    <li class="nav-item">
                        <a href="../../pages/auth/register.html" class="nav-link active">
                            <p class="text-body-large">Sign Up</p>

                            <div class="state-layer"></div>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="../../pages/auth/login.html" class="nav-link">
                            <p class="text-body-large">Sign In</p>

                            <div class="state-layer"></div>
                        </a>
                    </li>
                </ul>

                <div class="form-group">
                    <label for="phone_number" class="text-body-medium">Phone Number</label>

                    <div class="input-wrapper medium">
                        <input type="tel" placeholder="Enter your phone number" name="phone" value="" id="phone_number" class="text-body-large" />
                    </div>

                    <!-- <p class="text-error text-body-medium"></p> -->
                </div>

                <button type="submit" class="btn filled medium w-full">
                    <p class="text-body-large">Create Account</p>

                    <div class="state-layer"></div>
                </button>
            </form>

        </div>

    </article>

</body>
