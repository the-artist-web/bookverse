<body>

    <!-- Overlay & Progress Bar -->
    <div class="overlay" data-overlay></div>
    <div class="progress-bar" data-progress-bar></div>

    <!-- Start Loading -->
    <div class="start-loading" data-start-loading>
        <div class="logo extra-large">
            <img src="../../src/assets/images/logo.png" alt="noqta" class="img-logo img-cover" />
        </div>
    </div>
    
    <!-- Auth Page -->
    <article class="auth-page">

        <div class="auth-body">

            <a href="../../index.html" class="logo medium">
                <img src="../../src/assets/images/logo.png" alt="noqta" loading="lazy" class="img-logo img-cover">
            </a>

            <div class="wrapper-block">
                <h1 class="text-headline-medium text-loard">Create Account</h1>

                <p class="text-body-large text-on-background-variant">Join our community of Noqta</p>
            </div>

            <form action="#" method="POST" class="auth-card">
                <ul class="nav nav-tabs" id="tabAuth">
                    <li class="nav-item">
                        <a href="../../pages/auth/register.html" class="nav-link active">
                            <p class="text-body-large">Sign Up</p>

                            <div class="state-layer"></div>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="../../pages/auth/login.html" class="nav-link">
                            <p class="text-body-large">Sign In</p>

                            <div class="state-layer"></div>
                        </a>
                    </li>
                </ul>

                <div class="form-group">
                    <label for="phone_number" class="text-body-medium">Phone Number</label>

                    <div class="input-wrapper medium">
                        <input type="tel" placeholder="Enter your phone number" name="phone" value="" id="phone_number" class="text-body-large" />
                    </div>

                    <!-- <p class="text-error text-body-medium"></p> -->
                </div>

                <button type="submit" class="btn filled medium w-full">
                    <p class="text-body-large">Create Account</p>

                    <div class="state-layer"></div>
                </button>
            </form>

        </div>

    </article>

</body>
